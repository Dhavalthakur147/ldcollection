{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="section-header">
        <h2>Checkout</h2>
        <p>Fast checkout for a clean shopping flow.</p>
    </div>

    <div class="checkout">
        <form class="checkout-form" method="post">
            <div class="form-group">
                <label class="label" for="name">Full name</label>
                <input class="input" id="name" name="name" value="{{ prefill_name or '' }}" required>
            </div>
            <div class="form-group">
                <label class="label" for="email">Email</label>
                <input class="input" id="email" name="email" type="email" value="{{ prefill_email or '' }}" required>
            </div>
            <div class="form-group">
                <label class="label" for="phone">Phone</label>
                <input class="input" id="phone" name="phone">
            </div>
            <div class="form-group">
                <label class="label" for="address">Street address</label>
                <input class="input" id="address" name="address" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="label" for="city">City</label>
                    <input class="input" id="city" name="city">
                </div>
                <div class="form-group">
                    <label class="label" for="state">State</label>
                    <input class="input" id="state" name="state">
                </div>
                <div class="form-group">
                    <label class="label" for="zipcode">ZIP</label>
                    <input class="input" id="zipcode" name="zipcode">
                </div>
            </div>
            <button class="btn" type="submit">Place order</button>
        </form>

        <aside class="summary">
            <h3>Order summary</h3>
            {% for item in items %}
            <div class="summary-row">
                <span>{{ item.product.name }} x {{ item.quantity }}</span>
                <span>{{ (item.product.price * item.quantity)|inr }}</span>
            </div>
            {% endfor %}
            <div class="summary-row total">
                <strong>Total</strong>
                <strong>{{ total|inr }}</strong>
            </div>
        </aside>
    </div>
</section>
{% endblock %}
