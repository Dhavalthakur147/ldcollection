{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="section-header">
        <h2>Manage users</h2>
        <p>Create, update, and delete admin users.</p>
    </div>

    <form class="admin-form compact" method="post" action="{{ url_for('admin_add_user') }}">
        <div class="form-row">
            <div class="form-group">
                <label class="label" for="username">Username</label>
                <input class="input" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label class="label" for="password">Password</label>
                <input class="input" id="password" name="password" type="password" minlength="6" required>
            </div>
        </div>
        <button class="btn" type="submit">Add user</button>
    </form>
</section>

<section class="section">
    <div class="section-header">
        <h2>Admin users</h2>
    </div>
    {% if users %}
    <div class="table-wrap">
        <table class="table">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.created_at }}</td>
                    <td class="actions">
                        <a class="link" href="{{ url_for('admin_edit_user', user_id=user.id) }}">Edit</a>
                        <form method="post" action="{{ url_for('admin_delete_user', user_id=user.id) }}" class="inline-form">
                            <button type="submit" class="link danger">Delete</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    {% else %}
    <p class="muted">No users found.</p>
    {% endif %}
</section>
{% endblock %}
