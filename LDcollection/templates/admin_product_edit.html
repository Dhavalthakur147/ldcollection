{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="section-header">
        <h2>Edit product</h2>
        <p>Update product details, stock, and image.</p>
    </div>

    <form class="admin-form" method="post" enctype="multipart/form-data">
        <div class="form-row">
            <div class="form-group">
                <label class="label" for="name">Name</label>
                <input class="input" id="name" name="name" value="{{ product.name }}" required>
            </div>
            <div class="form-group">
                <label class="label" for="category">Category</label>
                <select class="input" id="category" name="category">
                    <option value="">Select category</option>
                    {% for category in categories %}
                    <option value="{{ category.name }}" {% if category.name == product.category %}selected{% endif %}>{{ category.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-group">
            <label class="label" for="category_custom">Or set new category</label>
            <input class="input" id="category_custom" name="category_custom" placeholder="Leave blank to keep selected category">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="label" for="price">Price</label>
                <input class="input" id="price" name="price" type="number" min="0" step="0.01" value="{{ product.price }}" required>
            </div>
            <div class="form-group">
                <label class="label" for="stock">Stock</label>
                <input class="input" id="stock" name="stock" type="number" min="0" value="{{ product.stock }}" required>
            </div>
        </div>

        <div class="form-group">
            <label class="label" for="description">Description</label>
            <textarea class="input textarea" id="description" name="description" rows="3">{{ product.description }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="label" for="image_url">Image URL</label>
                <input class="input" id="image_url" name="image_url" value="{{ product.image_url }}">
            </div>
            <div class="form-group">
                <label class="label" for="image_file">Upload new image</label>
                <input class="input" id="image_file" name="image_file" type="file" accept=".png,.jpg,.jpeg,.webp,.gif">
            </div>
        </div>

        <div class="form-group">
            <label class="label">Current image</label>
            <img class="thumb-large" src="{{ product.image_url }}" alt="{{ product.name }}">
        </div>

        <div class="admin-actions">
            <button class="btn" type="submit">Save changes</button>
            <a class="btn btn-secondary" href="{{ url_for('admin_products') }}">Back to products</a>
        </div>
    </form>
</section>
{% endblock %}
