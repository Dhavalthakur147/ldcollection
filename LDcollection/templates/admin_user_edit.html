{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="section-header">
        <h2>Edit user</h2>
        <p>Update username and optionally set a new password.</p>
    </div>

    <form class="admin-form compact" method="post">
        <div class="form-group">
            <label class="label" for="username">Username</label>
            <input class="input" id="username" name="username" value="{{ user.username }}" required>
        </div>
        <div class="form-group">
            <label class="label" for="password">New password (optional)</label>
            <input class="input" id="password" name="password" type="password" minlength="6">
        </div>

        <div class="admin-actions">
            <button class="btn" type="submit">Save user</button>
            <a class="btn btn-secondary" href="{{ url_for('admin_users') }}">Back to users</a>
        </div>
    </form>
</section>
{% endblock %}
